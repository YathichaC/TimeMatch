flex-col justify-center items-center py-space-xl px-gutter"><div class="flex flex-col w-full items-center justify-center relative">

<div class="absolute -bottom-24 -right-16 w-80 h-80 rounded-full bg-gradient-to-br from-tertiary-fixed/30 via-primary-container/10 to-transparent blur-2xl pointer-events-none"></div>
<div class="w-full max-w-md mx-auto relative z-10 px-space-sm sm:px-0">
<div class="bg-surface-container-lowest rounded-2xl shadow-xl p-space-lg sm:p-space-xl flex flex-col gap-space-md">

<form class="flex flex-col gap-space-md mt-1" id="loginForm" onsubmit="event.preventDefault(); validateForm();">
<div class="flex flex-col gap-1.5">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>


<script>
  (function initLoginPage() {
    const passwordInput = document.getElementById('studentPassword');
    const toggleBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();

  function clearErrors() {
    const alertBox = document.getElementById('alertBox');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const emailInput = document.getElementById('studentEmail');
    const passwordInput = document.getElementById('studentPassword');

    alertBox.classList.add('hidden');
    emailError.classList.add('hidden');
    passwordError.classList.add('hidden');
    emailInput.classList.remove('bg-error-container/30', 'text-error');
    passwordInput.classList.remove('bg-error-container/30', 'text-error');
  }

  function fillDemoAccount() {
    clearErrors();
    const emailInput = document.getElementById('studentEmail');
    const passwordInput = document.getElementById('studentPassword');
    emailInput.value = 'chidchanok.b@kkumail.com';
    passwordInput.value = 'TimeMatch2025!';
    
    emailInput.classList.add('bg-tertiary-fixed/40');
    passwordInput.classList.add('bg-tertiary-fixed/40');
    setTimeout(() => {
      emailInput.classList.remove('bg-tertiary-fixed/40');
      passwordInput.classList.remove('bg-tertiary-fixed/40');
    }, 600);
  }

  
async function validateForm() {
  clearErrors();

  const email = document.getElementById('studentEmail').value.trim();
  const password = document.getElementById('studentPassword').value;
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  if (!email) {
    showEmailError('กรุณากรอกอีเมลนักศึกษา');
    return;
  }

  if (!emailRegex.test(email)) {
    showEmailError('รูปแบบอีเมลไม่ถูกต้อง (เช่น example@kkumail.com)');
    return;
  }

  if (!password) {
    showPasswordError('กรุณากรอกรหัสผ่าน');
    return;
  }

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    console.error(error);
    showAlertError('อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบข้อมูลอีกครั้ง');
    return;
  }

  console.log('Login success:', data);

  const alertBox = document.getElementById('alertBox');
  const alertMessage = document.getElementById('alertMessage');

  alertBox.className =
    'rounded-xl bg-tertiary-fixed p-space-sm transition-all duration-200';

  alertMessage.textContent =
    'เข้าสู่ระบบสำเร็จ กำลังพาไปยังหน้าหลัก...';

  alertMessage.className =
    'font-body-sm text-body-sm font-semibold text-on-tertiary-fixed-variant';

  alertBox.classList.remove('hidden');

  setTimeout(() => {
    window.location.href = 'home.html';
  }, 1000);
}

  function showEmailError(msg) {
    const errorEl = document.getElementById('emailError');
    const inputEl = document.getElementById('studentEmail');
    errorEl.textContent = msg;
    errorEl.classList.remove('hidden');
    inputEl.classList.add('bg-error-container/30', 'text-error');
    inputEl.focus();
  }

  function showPasswordError(msg) {
    const errorEl = document.getElementById('passwordError');
    const inputEl = document.getElementById('studentPassword');
    errorEl.textContent = msg;
    errorEl.classList.remove('hidden');
    inputEl.classList.add('bg-error-container/30', 'text-error');
    inputEl.focus();
  }

  function showAlertError(msg) {
    const alertBox = document.getElementById('alertBox');
    const alertMessage = document.getElementById('alertMessage');
    alertBox.className = 'rounded-xl bg-error-container p-space-sm transition-all duration-200';
    alertMessage.textContent = msg;
    alertMessage.className = 'font-body-sm text-body-sm font-medium text-on-error-container';
    alertBox.classList.remove('hidden');
  }

  function triggerValidation(type) {
    clearErrors();
    const emailInput = document.getElementById('studentEmail');
    const passwordInput = document.getElementById('studentPassword');

    if (type === 'emptyEmail') {
      emailInput.value = '';
      showEmailError('กรุณากรอกอีเมล');
    } else if (type === 'invalidEmail') {
      emailInput.value = 'chidchanok.invalid';
      showEmailError('รูปแบบอีเมลไม่ถูกต้อง');
    } else if (type === 'emptyPass') {
      emailInput.value = 'student@kkumail.com';
      passwordInput.value = '';
      showPasswordError('กรุณากรอกรหัสผ่าน');
    } else if (type === 'authFail') {
      emailInput.value = 'chidchanok.b@kkumail.com';
      passwordInput.value = 'wrongpassword123';
      showAlertError('อีเมลหรือรหัสผ่านไม่ถูกต้อง');
    } else if (type === 'reset') {
      emailInput.value = '';
      passwordInput.value = '';
      clearErrors();
    }
  }
</script></main>
