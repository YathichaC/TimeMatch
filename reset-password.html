<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ตั้งรหัสผ่านใหม่ | TimeMatch</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
        rel="stylesheet">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#09696a",
                        "primary-container": "#4f9d9d",

                        background: "#f4faff",

                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#e9f6fd",

                        "on-surface": "#111d23",
                        "on-surface-variant": "#3f4948",

                        outline: "#6f7979",

                        error: "#ba1a1a",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",

                        tertiary: "#20693e",
                        "tertiary-fixed": "#a9f3bc"
                    },

                    fontFamily: {
                        body: ["Inter"],
                        headline: ["Plus Jakarta Sans"]
                    }
                }
            }
        }
    </script>
</head>


<body
    class="bg-background font-body text-on-surface antialiased min-h-screen flex flex-col justify-center items-center">


    <main
        class="w-full flex-1 flex flex-col justify-center items-center py-10 px-4">

        <div class="flex flex-col w-full items-center justify-center relative">

            <!-- Background decoration -->
            <div
                class="absolute -top-32 -left-20 w-96 h-96 rounded-full
                       bg-gradient-to-tr from-primary/10
                       via-blue-200/20 to-transparent
                       blur-3xl pointer-events-none">
            </div>

            <div
                class="absolute -bottom-24 -right-16 w-80 h-80 rounded-full
                       bg-gradient-to-br from-green-200/30
                       via-primary-container/10 to-transparent
                       blur-2xl pointer-events-none">
            </div>


            <!-- Card -->
            <div class="w-full max-w-md mx-auto relative z-10">

                <div
                    class="bg-surface-container-lowest
                           rounded-2xl shadow-xl
                           p-6 sm:p-10
                           flex flex-col gap-5">


                    <!-- Logo -->
                    <div class="flex items-center gap-3">

                        <img
                            src="images/logo.png"
                            alt="TimeMatch Logo"
                            class="w-10 h-10 rounded-lg object-contain shadow-sm">

                        <div class="flex flex-col">

                            <span
                                class="font-headline text-lg
                                       text-primary font-bold tracking-tight">
                                TimeMatch
                            </span>

                            <span
                                class="text-xs
                                       text-on-surface-variant font-medium">
                                วิทยาลัยการคอมพิวเตอร์
                            </span>

                        </div>

                    </div>


                    <!-- Heading -->
                    <div class="flex flex-col gap-1 mt-1">

                        <h1
                            class="font-headline text-2xl
                                   font-bold text-on-surface">
                            ตั้งรหัสผ่านใหม่
                        </h1>

                        <p
                            class="text-sm text-on-surface-variant leading-relaxed">
                            กำหนดรหัสผ่านใหม่สำหรับบัญชี TimeMatch ของคุณ
                        </p>

                    </div>


                    <!-- Alert -->
                    <div
                        id="alertBox"
                        class="hidden rounded-xl
                               bg-error-container p-3">

                        <div
                            class="flex items-center gap-2
                                   text-on-error-container">

                            <span
                                class="material-symbols-outlined text-[20px]">
                                error
                            </span>

                            <span
                                id="alertMessage"
                                class="text-sm font-medium">
                            </span>

                        </div>

                    </div>


                    <!-- Success -->
                    <div
                        id="successBox"
                        class="hidden rounded-xl
                               bg-tertiary-fixed/50 p-3">

                        <div
                            class="flex items-center gap-2 text-tertiary">

                            <span
                                class="material-symbols-outlined text-[20px]">
                                check_circle
                            </span>

                            <span class="text-sm font-medium">
                                เปลี่ยนรหัสผ่านสำเร็จ
                            </span>

                        </div>

                    </div>


                    <!-- Form -->
                    <form
                        id="resetPasswordForm"
                        class="flex flex-col gap-4 mt-1">


                        <!-- New password -->
                        <div class="flex flex-col gap-1.5">

                            <label
                                for="newPassword"
                                class="text-sm font-medium text-on-surface">

                                รหัสผ่านใหม่

                            </label>

                            <div class="relative flex items-center">

                                <span
                                    class="material-symbols-outlined
                                           absolute left-3.5
                                           text-outline text-[20px]">

                                    lock_outline

                                </span>

                                <input
                                    id="newPassword"
                                    type="password"
                                    autocomplete="new-password"
                                    placeholder="กรอกรหัสผ่านใหม่"
                                    class="w-full
                                           bg-surface-container-low
                                           text-on-surface
                                           rounded-xl
                                           pl-11 pr-11 py-3
                                           placeholder:text-outline
                                           focus:outline-none
                                           focus:bg-white
                                           focus:shadow-md
                                           transition-all">

                                <button
                                    id="toggleNewPassword"
                                    type="button"
                                    class="absolute right-3.5
                                           text-outline hover:text-on-surface">

                                    <span
                                        id="newPasswordEye"
                                        class="material-symbols-outlined text-[20px]">

                                        visibility

                                    </span>

                                </button>

                            </div>

                            <span
                                class="text-xs text-on-surface-variant pl-1">

                                ใช้อย่างน้อย 8 ตัวอักษร

                            </span>

                        </div>


                        <!-- Confirm password -->
                        <div class="flex flex-col gap-1.5">

                            <label
                                for="confirmPassword"
                                class="text-sm font-medium text-on-surface">

                                ยืนยันรหัสผ่านใหม่

                            </label>

                            <div class="relative flex items-center">

                                <span
                                    class="material-symbols-outlined
                                           absolute left-3.5
                                           text-outline text-[20px]">

                                    lock

                                </span>

                                <input
                                    id="confirmPassword"
                                    type="password"
                                    autocomplete="new-password"
                                    placeholder="กรอกรหัสผ่านใหม่อีกครั้ง"
                                    class="w-full
                                           bg-surface-container-low
                                           text-on-surface
                                           rounded-xl
                                           pl-11 pr-11 py-3
                                           placeholder:text-outline
                                           focus:outline-none
                                           focus:bg-white
                                           focus:shadow-md
                                           transition-all">

                                <button
                                    id="toggleConfirmPassword"
                                    type="button"
                                    class="absolute right-3.5
                                           text-outline hover:text-on-surface">

                                    <span
                                        id="confirmPasswordEye"
                                        class="material-symbols-outlined text-[20px]">

                                        visibility

                                    </span>

                                </button>

                            </div>

                        </div>


                        <!-- Submit -->
                        <button
                            id="submitButton"
                            type="submit"
                            class="w-full
                                   bg-primary
                                   hover:bg-primary-container
                                   text-white
                                   font-headline font-semibold
                                   py-3 px-4
                                   rounded-xl
                                   shadow-md
                                   transition-all
                                   active:scale-[0.99]
                                   flex items-center
                                   justify-center gap-2
                                   mt-1">

                            <span id="submitText">
                                ตั้งรหัสผ่านใหม่
                            </span>

                            <span
                                class="material-symbols-outlined text-[20px]">

                                arrow_forward

                            </span>

                        </button>

                    </form>


                    <!-- Back -->
                    <div class="text-center pt-2">

                        <a
                            href="login.html"
                            class="text-sm font-semibold
                                   text-primary
                                   hover:text-primary-container">

                            กลับไปหน้าเข้าสู่ระบบ

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>


    <script>

        const form =
            document.getElementById("resetPasswordForm");

        const newPassword =
            document.getElementById("newPassword");

        const confirmPassword =
            document.getElementById("confirmPassword");

        const alertBox =
            document.getElementById("alertBox");

        const alertMessage =
            document.getElementById("alertMessage");

        const successBox =
            document.getElementById("successBox");

        const submitButton =
            document.getElementById("submitButton");

        const submitText =
            document.getElementById("submitText");


        // ===============================
        // แสดง Error
        // ===============================

        function showError(message) {

            alertMessage.textContent = message;

            alertBox.classList.remove("hidden");

            successBox.classList.add("hidden");
        }


        // ===============================
        // Show / Hide Password
        // ===============================

        function setupPasswordToggle(
            buttonId,
            inputId,
            iconId
        ) {

            const button =
                document.getElementById(buttonId);

            const input =
                document.getElementById(inputId);

            const icon =
                document.getElementById(iconId);


            button.addEventListener("click", function () {

                const hidden =
                    input.type === "password";

                input.type =
                    hidden ? "text" : "password";

                icon.textContent =
                    hidden
                        ? "visibility_off"
                        : "visibility";

            });

        }


        setupPasswordToggle(
            "toggleNewPassword",
            "newPassword",
            "newPasswordEye"
        );

        setupPasswordToggle(
            "toggleConfirmPassword",
            "confirmPassword",
            "confirmPasswordEye"
        );


        // ===============================
        // Reset Password
        // ===============================

        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                alertBox.classList.add("hidden");
                successBox.classList.add("hidden");


                const password =
                    newPassword.value.trim();

                const confirm =
                    confirmPassword.value.trim();


                // ตรวจช่องว่าง
                if (!password || !confirm) {

                    showError(
                        "กรุณากรอกรหัสผ่านให้ครบ"
                    );

                    return;
                }


                // ความยาว
                if (password.length < 8) {

                    showError(
                        "รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร"
                    );

                    return;
                }


                // Password ไม่ตรงกัน
                if (password !== confirm) {

                    showError(
                        "รหัสผ่านทั้งสองช่องไม่ตรงกัน"
                    );

                    return;
                }


                // Loading
                submitButton.disabled = true;

                submitText.textContent =
                    "กำลังบันทึก...";


                // เปลี่ยน Password ใน Supabase
                const { error } =
                    await supabaseClient.auth.updateUser({
                        password: password
                    });


                if (error) {

                    console.error(
                        "RESET PASSWORD ERROR:",
                        error
                    );

                    showError(
                        "ไม่สามารถเปลี่ยนรหัสผ่านได้ กรุณาเปิดลิงก์รีเซ็ตรหัสผ่านจากอีเมลอีกครั้ง"
                    );

                    submitButton.disabled = false;

                    submitText.textContent =
                        "ตั้งรหัสผ่านใหม่";

                    return;
                }


                console.log(
                    "PASSWORD UPDATED SUCCESSFULLY"
                );


                // สำเร็จ
                successBox.classList.remove("hidden");

                submitText.textContent =
                    "เปลี่ยนรหัสผ่านสำเร็จ";


                // Logout recovery session
                await supabaseClient.auth.signOut();


                // กลับ Login
                setTimeout(function () {

                    window.location.href =
                        "login.html";

                }, 1500);

            }
        );

    </script>


</body>

</html>
